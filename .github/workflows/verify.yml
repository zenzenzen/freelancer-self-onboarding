name: Verify workspace isolation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build the shared CLI image
        run: docker build -t freelancer-self-onboarding:1 skills/freelancer-self-onboarding
      - name: Run host and two-client container tests
        env:
          TEST_DOCKER: "1"
        run: python3 -m unittest discover -s tests -v
